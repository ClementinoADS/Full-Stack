<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lista de Tarefas</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-md bg-slate-800 rounded-2xl shadow-xl p-6 border border-slate-700">
        <header class="mb-6">
            <h1 class="text-2xl font-bold flex items-center gap-2 text-indigo-400">
                <i data-lucide="check-square" class="w-7 h-7"></i>
                Lista de Tarefas
            </h1>
            <p class="text-slate-400 text-sm mt-1">Organize seu dia de forma simples e rápida!</p>
        </header>

        <div class="flex gap-2 mb-6">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="Digite suas tarefas aqui" 
                class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-3 text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 transition-colors"
            >
            <button 
                id="addTaskBtn" 
                class="bg-indigo-600 hover:bg-indigo-500 text-white font-medium px-5 py-3 rounded-xl transition-colors flex items-center justify-center cursor-pointer shadow-lg shadow-indigo-600/30"
            >
                <i data-lucide="plus" class="w-5 h-5"></i>
            </button>
        </div>

        <ul id="taskList" class="space-y-3 mb-6 max-h-80 overflow-y-auto pr-1"></ul>

        <footer class="flex justify-between items-center text-xs text-slate-400 border-t border-slate-700 pt-4">
            <span id="taskCount">0 tarefas pendentes</span>
            <button id="clearAllBtn" class="hover:text-red-400 transition-colors cursor-pointer">Limpar concluídas</button>
        </footer>
    </div>

    <!-- O HTML chama o arquivo JavaScript aqui para integrá-los -->
    <script src="script.js"></script>
</body>
</html>
