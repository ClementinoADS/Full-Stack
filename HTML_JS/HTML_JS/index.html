<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minha Lista de Tarefas</title>
    <!-- Link para o arquivo CSS separado -->
    <link rel="stylesheet" href="style.css">
    <!-- Ícones Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

    <div class="todo-container">
        <!-- Cabeçalho -->
        <header class="todo-header">
            <h1>
                <i data-lucide="check-square" class="icon-title"></i>
                Minhas Tarefas
            </h1>
            <p>Organize seu dia de forma simples e rápida.</p>
        </header>

        <!-- Formulário de Adição -->
        <div class="todo-form">
            <input 
                type="text" 
                id="taskInput" 
                placeholder="O que você precisa fazer?" 
                autocomplete="off"
            >
            <button id="addTaskBtn" title="Adicionar tarefa">
                <i data-lucide="plus" class="icon-btn"></i>
            </button>
        </div>

        <!-- Lista de Tarefas -->
        <ul id="taskList" class="todo-list">
            <!-- As tarefas inseridas via JS vão aparecer aqui -->
        </ul>

        <!-- Rodapé com Contador -->
        <footer class="todo-footer">
            <span id="taskCount">0 tarefas pendentes</span>
            <button id="clearAllBtn">Limpar concluídas</button>
        </footer>
    </div>

    <!-- Link para o arquivo JavaScript separado -->
    <script src="script.js"></script>
</body>
</html>
